server {
    listen 80;
    listen [::]:80;
    server_name getbudgetpilot-web.com www.getbudgetpilot-web.com;

    # Redirection HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name getbudgetpilot-web.com www.getbudgetpilot-web.com;

    # Certificats SSL (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/getbudgetpilot-web.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getbudgetpilot-web.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/budget_pilot_web;
    index index.html;

    charset utf-8;
    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # ─── Proxy vers Laravel pour les QR codes ────────────────────────────────
    # Quand quelqu'un scanne un QR code (ex: https://getbudgetpilot-web.com/ref/ABC12)
    # on redirige vers le backend Laravel qui enregistre le scan et redirige vers le store
    location /ref/ {
        proxy_pass         http://127.0.0.1:80/ref/;
        proxy_set_header   Host 127.0.0.1;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;
    }

    # ─── SPA React ────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
